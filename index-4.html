<style>
  :root{
    --bg:#FAF9F4;
    --surface:#FFFFFF;
    --surface-sunk:#F1EEE5;
    --ink:#1E2420;
    --ink-muted:#767C74;
    --ink-faint:#A8AC9F;
    --line:#E4E0D4;
    --sage:#4B7C6D;
    --sage-dark:#3A6255;
    --sage-soft:#E4EEE8;
    --amber:#C08A34;
    --amber-soft:#F6ECD8;
    --rust:#A6472E;
    --rust-soft:#F3E1DA;
    --radius-card:18px;
    --radius-pill:999px;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#EDEAE0;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
  }
  .mono{font-family:'IBM Plex Mono', monospace;}

  /* ---------- App shell (真機上會滿版；桌面瀏覽器則置中呈現手機寬度) ---------- */
  #app-shell{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,.08);
  }

  /* ---------- App header ---------- */
  .app-header{
    padding:calc(env(safe-area-inset-top) + 10px) 18px 14px;
    flex-shrink:0;
    border-bottom:1px solid var(--line);
    background:var(--surface);
    position:sticky; top:0; z-index:40;
  }
  .app-header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .menu-btn{
    width:34px;height:34px;
    border:none; background:var(--surface-sunk);
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .menu-btn span{display:block; width:15px; height:2px; background:var(--ink); position:relative;}
  .menu-btn span::before,.menu-btn span::after{content:'';position:absolute;left:0;width:15px;height:2px;background:var(--ink);}
  .menu-btn span::before{top:-5px;} .menu-btn span::after{top:5px;}
  .page-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--ink-muted);
    text-transform:uppercase;
  }
  .header-spacer{width:34px;}

  .date-strip{margin-top:14px;}
  .date-strip-header{
    display:flex; align-items:center; justify-content:center; gap:16px;
    margin-bottom:14px;
  }
  .arrow-circle{
    width:34px;height:34px; border-radius:50%; border:none;
    background:var(--surface-sunk); color:var(--ink-muted);
    font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .month-label{font-size:15px; font-weight:600; min-width:104px; text-align:center;}
  .date-strip-scroll{
    display:flex; gap:9px; overflow-x:auto; padding:2px 2px 6px;
    scroll-snap-type:x proximity; scrollbar-width:none; -ms-overflow-style:none;
  }
  .date-strip-scroll::-webkit-scrollbar{display:none;}
  .date-cell{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    flex-shrink:0; cursor:pointer; scroll-snap-align:center; border:none; background:none; padding:0;
    font-family:inherit;
  }
  .date-cell .dow{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase;}
  .date-cell .num{
    width:38px; height:38px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15.5px; color:var(--ink);
    transition:background .15s ease, color .15s ease;
  }
  .date-cell.selected .num{background:var(--sage); color:#fff;}
  .date-cell.today:not(.selected) .num{box-shadow:inset 0 0 0 1.5px var(--sage);}

  /* ---------- Main scroll area ---------- */
  .app-main{flex:1; overflow-y:auto; padding:16px 18px calc(100px + env(safe-area-inset-bottom));}
  .page{display:none;}
  .page.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .section-label{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-faint); margin:20px 0 10px;
  }
  .section-label:first-child{margin-top:2px;}

  /* ---------- Capsule signature element ---------- */
  .capsule-icon{
    width:26px; height:14px; border-radius:var(--radius-pill); flex-shrink:0;
    display:flex; overflow:hidden; border:1.5px solid currentColor;
  }
  .capsule-icon span{flex:1;}
  .capsule-icon span:first-child{background:currentColor; opacity:.9;}
  .capsule-icon span:last-child{background:transparent;}
  .capsule-icon.filled span{background:currentColor; opacity:1;}

  /* ---------- Daily: item rows ---------- */
  .item-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    border-radius:var(--radius-card); margin-bottom:8px; cursor:pointer;
    transition:transform .12s ease; border:none; width:100%; text-align:left; font-family:inherit;
  }
  .item-row:active{transform:scale(.98);}
  .item-row.scheduled{background:var(--surface); border:1.5px solid var(--amber); color:var(--amber);}
  .item-row.taken{background:var(--sage); color:#fff;}
  .item-main{flex:1; min-width:0;}
  .item-name{font-size:15px; font-weight:600; color:var(--ink);}
  .item-row.taken .item-name{color:#fff;}
  .item-row.scheduled .item-name{color:var(--ink);}
  .item-sub{font-size:12.5px; margin-top:2px; font-family:'IBM Plex Mono',monospace;}
  .item-row.scheduled .item-sub{color:var(--amber);}
  .item-row.taken .item-sub{color:rgba(255,255,255,.8);}
  .item-check{
    width:30px;height:30px; border-radius:50%; border:1.5px solid var(--amber);
    background:transparent; flex-shrink:0; display:flex;align-items:center;justify-content:center;
    color:var(--amber); font-size:15px; cursor:pointer;
  }
  .item-row.taken .item-check{border:none; color:#fff; font-size:13px;}
  .empty-hint{font-size:13px; color:var(--ink-faint); padding:10px 4px 4px;}

  .edit-pop{display:none; margin:-4px 0 10px; background:var(--surface-sunk); border-radius:14px; padding:12px 14px; font-size:13px;}
  .edit-pop.open{display:block;}
  .edit-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .edit-row:last-child{margin-bottom:0;}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:26px;height:26px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:14px; cursor:pointer;}
  .stepper .val{font-family:'IBM Plex Mono',monospace; min-width:20px; text-align:center;}
  .time-input{font-family:'IBM Plex Mono',monospace; border:1px solid var(--line); border-radius:8px; padding:4px 8px; background:var(--surface); font-size:13px;}

  .fab{
    position:absolute; right:20px; bottom:calc(26px + env(safe-area-inset-bottom));
    background:var(--sage); color:#fff; border:none; border-radius:var(--radius-pill);
    padding:13px 20px; font-size:14px; font-weight:600; font-family:'IBM Plex Sans',sans-serif;
    box-shadow:0 10px 24px -8px rgba(75,124,109,.6);
    display:none; align-items:center; gap:6px; cursor:pointer; z-index:20;
  }
  .fab.show{display:flex;}

  /* ---------- Full-screen editor overlay (Supplement editor / Nutrient DB) ---------- */
  .editor-overlay{
    position:absolute; inset:0; background:var(--bg); z-index:95;
    transform:translateX(100%); transition:transform .28s cubic-bezier(.2,.8,.3,1);
    display:flex; flex-direction:column;
  }
  .editor-overlay.open{transform:translateX(0);}
  .editor-header{
    height:calc(54px + env(safe-area-inset-top)); flex-shrink:0; padding-top:env(safe-area-inset-top);
    display:flex; align-items:center; justify-content:space-between; padding-left:8px; padding-right:8px;
    border-bottom:1px solid var(--line); background:var(--surface);
  }
  .editor-back{width:38px; height:38px; border:none; background:transparent; font-size:24px; color:var(--ink); cursor:pointer;}
  .editor-title{font-size:15px; font-weight:700;}
  .editor-save{border:none; background:transparent; color:var(--sage-dark); font-weight:700; font-size:14px; cursor:pointer; padding:8px 10px;}
  .editor-body{flex:1; overflow-y:auto; padding:18px 18px 60px;}

  .field-label{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin:22px 0 8px;}
  .field-label:first-child{margin-top:0;}
  .field-input{width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-size:14px; background:var(--surface); font-family:'IBM Plex Sans', sans-serif;}
  .field-input:focus{outline:none; border-color:var(--sage);}
  .field-hint{font-size:11.5px; color:var(--ink-faint); line-height:1.6; margin:-2px 0 10px;}

  .chip-select{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1.5px solid var(--line); background:var(--surface); color:var(--ink-muted); border-radius:var(--radius-pill); padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .chip.active{background:var(--sage); border-color:var(--sage); color:#fff;}

  .stepper.big{display:flex; align-items:center; gap:16px;}
  .stepper.big button{width:34px; height:34px; font-size:18px; border-radius:50%; border:1px solid var(--line); background:var(--surface); cursor:pointer;}
  .stepper.big .val{font-size:17px; min-width:24px; text-align:center;}

  .nutrient-line{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin-bottom:8px;}
  .nutrient-line .nl-name{flex:1; font-size:13.5px; font-weight:600;}
  .nutrient-line input.amount{width:60px; border:1px solid var(--line); border-radius:8px; padding:5px 6px; font-family:'IBM Plex Mono', monospace; font-size:12.5px; text-align:right;}
  .nutrient-line .nl-unit{font-size:11.5px; color:var(--ink-muted); font-family:'IBM Plex Mono', monospace; width:24px;}
  .nl-remove{border:none; background:transparent; color:var(--ink-faint); font-size:15px; cursor:pointer;}

  .btn{border:none; border-radius:10px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans',sans-serif;}
  .btn-ghost{background:var(--surface-sunk); color:var(--ink);}
  .btn-rust{background:var(--rust); color:#fff;}
  .btn-sage{background:var(--sage); color:#fff;}
  .btn.full{width:100%; text-align:center;}

  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:2px 0; font-size:14px; font-weight:500;}
  .switch{width:44px; height:26px; border-radius:var(--radius-pill); border:none; background:var(--line); position:relative; cursor:pointer; transition:background .15s ease; padding:0;}
  .switch.on{background:var(--sage);}
  .switch .knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s ease; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch.on .knob{left:21px;}

  .reminder-fields{display:none; margin-top:14px;}
  .reminder-fields.show{display:block;}
  .segmented{display:flex; background:var(--surface-sunk); border-radius:12px; padding:3px; margin-bottom:14px;}
  .segmented button{flex:1; border:none; background:transparent; padding:8px; border-radius:9px; font-size:12.5px; font-weight:600; color:var(--ink-muted); cursor:pointer;}
  .segmented button.active{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .weekday-picker{display:none; justify-content:space-between; gap:6px; margin-bottom:16px;}
  .weekday-picker.show{display:flex;}
  .weekday-picker button{flex:1; aspect-ratio:1; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:12.5px; cursor:pointer; color:var(--ink-muted);}
  .weekday-picker button.active{background:var(--sage); border-color:var(--sage); color:#fff;}
  .time-input.full{width:100%; padding:10px 12px; font-size:14px;}

  /* ---------- Nutrient Database screen ---------- */
  .nutrient-db-group-label{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); margin:20px 0 8px;}
  .nutrient-db-group-label:first-child{margin-top:0;}
  .nutrient-db-row{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px;}
  .ndb-top{display:flex; align-items:center; justify-content:space-between;}
  .ndb-name{font-size:14px; font-weight:600;}
  .ndb-unit{font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; margin-left:6px;}
  .ndb-target-row{display:flex; align-items:center; gap:8px; margin-top:9px;}
  .ndb-target-row label{font-size:12px; color:var(--ink-muted);}
  .ndb-target-row input{width:70px; border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-family:'IBM Plex Mono', monospace; font-size:12.5px;}
  .icon-btn{border:none; background:transparent; color:var(--ink-faint); font-size:15px; cursor:pointer; padding:4px;}

  /* ---------- Generic bottom sheet ---------- */
  .scrim{position:absolute; inset:0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:97;}
  .scrim.open{opacity:1; pointer-events:auto;}
  .sheet-head-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .add-sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--surface);
    border-radius:24px 24px 0 0; padding:10px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .26s cubic-bezier(.2,.8,.3,1);
    z-index:100; max-height:64%; display:flex; flex-direction:column;
  }
  .add-sheet.open{transform:translateY(0);}
  .add-sheet-handle{width:36px; height:4px; border-radius:var(--radius-pill); background:var(--line); margin:0 auto 14px;}
  .add-sheet-title{font-size:16px; font-weight:700;}
  .add-sheet-sub{font-size:12px; color:var(--ink-muted); margin:2px 0 14px;}
  #addSheetList{overflow-y:auto;}
  .add-sheet-item{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; width:100%; background:none; border-left:none; border-right:none; border-top:none; text-align:left; font-family:inherit;}
  .add-sheet-item:last-child{border-bottom:none;}
  .add-sheet-item .capsule-icon{color:var(--sage);}
  .add-sheet-item-main{flex:1;}
  .add-sheet-item-name{font-size:14px; font-weight:600;}
  .add-sheet-item-sub{font-size:11.5px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace; margin-top:1px;}
  .add-sheet-item-plus{width:26px;height:26px;border-radius:50%; background:var(--sage-soft); color:var(--sage-dark); display:flex;align-items:center;justify-content:center; font-size:15px;}

  .edit-cancel{width:100%; margin-top:2px; border:none; background:transparent; color:var(--rust); font-size:12.5px; font-weight:600; text-align:center; padding:8px 0 2px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif;}

  /* ---------- Dashboard ---------- */
  .nutrient-row{padding:13px 14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); margin-bottom:9px;}
  .nutrient-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}

<body>
  <div id="app-shell"></div>

<script>
/* ======================================================================
   DB — 最底層 IndexedDB 包裝（開資料庫、建表、通用讀寫）
   ====================================================================== */
const DB = {
  _db: null,
  NAME: 'supplement-tracker',
  VERSION: 1,

  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(this.NAME, this.VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('nutrients')){
          const s = db.createObjectStore('nutrients', {keyPath:'id'});
          s.createIndex('category', 'category', {unique:false});
        }
        if(!db.objectStoreNames.contains('supplements')){
          db.createObjectStore('supplements', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('dailyIntakes')){
          const s = db.createObjectStore('dailyIntakes', {keyPath:'id'});
          s.createIndex('dateKey', 'dateKey', {unique:false});
        }
        if(!db.objectStoreNames.contains('settings')){
          db.createObjectStore('settings', {keyPath:'id'});
        }
      };
      req.onsuccess = (e)=>{ this._db = e.target.result; resolve(this._db); };
      req.onerror = (e)=> reject(e.target.error);
    });
  },
  async getAll(store){
    const db = await this.open();
    return new Promise((resolve, reject)=>{
      const req = db.transaction(store, 'readonly').objectStore(store).getAll();
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  },
  async getAllByIndex(store, indexName, value){
    const db = await this.open();
    return new Promise((resolve, reject)=>{
      const idx = db.transaction(store, 'readonly').objectStore(store).index(indexName);
      const req = idx.getAll(value);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  },
  async get(store, id){
    const db = await this.open();
    return new Promise((resolve, reject)=>{
      const req = db.transaction(store, 'readonly').objectStore(store).get(id);
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> reject(req.error);
    });
  },
  async put(store, value){
    const db = await this.open();
    return new Promise((resolve, reject)=>{
      const req = db.transaction(store, 'readwrite').objectStore(store).put(value);
      req.onsuccess = ()=> resolve(value);
      req.onerror = ()=> reject(req.error);
    });
  },
  async delete(store, id){
    const db = await this.open();
    return new Promise((resolve, reject)=>{
      const req = db.transaction(store, 'readwrite').objectStore(store).delete(id);
      req.onsuccess = ()=> resolve(true);
      req.onerror = ()=> reject(req.error);
    });
  },
  async clearAll(){
    const db = await this.open();
    const stores = ['nutrients','supplements','dailyIntakes','settings'];
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(stores, 'readwrite');
      stores.forEach(s=> tx.objectStore(s).clear());
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }
};

/* ======================================================================
   Repository — 業務邏輯層（Snapshot 計算、刪除連動規則、Export/Import）
   ====================================================================== */
const Repository = {
  uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); },
  dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },

  // ---- Nutrient Database ----
  listNutrients(){ return DB.getAll('nutrients'); },
  async createNutrient({name, category, unit, dailyTarget}){
    const nd = {id:this.uuid(), name, category, unit, dailyTarget: (dailyTarget===''||dailyTarget==null)?null:dailyTarget};
    await DB.put('nutrients', nd);
    return nd;
  },
  async updateNutrientTarget(id, dailyTarget){
    const nd = await DB.get('nutrients', id);
    if(!nd) return null;
    nd.dailyTarget = (dailyTarget===''||dailyTarget==null) ? null : dailyTarget;
    await DB.put('nutrients', nd);
    return nd;
  },
  async nutrientUsageCount(id){
    const supplements = await DB.getAll('supplements');
    return supplements.filter(sp => (sp.nutrients||[]).some(n=>n.nutrientId===id)).length;
  },
  async deleteNutrient(id){
    await DB.delete('nutrients', id);
    const supplements = await DB.getAll('supplements');
    for(const sp of supplements){
      if((sp.nutrients||[]).some(n=>n.nutrientId===id)){
        sp.nutrients = sp.nutrients.filter(n=>n.nutrientId!==id);
        await DB.put('supplements', sp);
      }
    }
  },

  // ---- Supplement ----
  listSupplements(){ return DB.getAll('supplements'); },
  getSupplement(id){ return DB.get('supplements', id); },
  async saveSupplement(draft){
    const sp = {
      id: draft.id || this.uuid(),
      name: draft.name,
      unit: draft.unit,
      defaultQuantity: draft.defaultQuantity,
      nutrients: draft.nutrients || [],       // [{nutrientId, amountPerUnit}] —「每 1 個單位」的含量
      reminders: draft.reminders || []        // [{id, days:'daily'|[0-6], time}]
    };
    await DB.put('supplements', sp);
    return sp;
  },
  async deleteSupplement(id){
    // 只刪除定義本身，不觸碰 dailyIntakes；歷史紀錄靠自帶的 supplementName/supplementUnit/nutrientSnapshot 維持正常顯示
    await DB.delete('supplements', id);
  },

  // ---- Daily Intake（含 Nutrient Snapshot）----
  getIntakesForDate(dateKey){ return DB.getAllByIndex('dailyIntakes', 'dateKey', dateKey); },

  async buildSnapshot(sp, quantity){
    const nutrients = await this.listNutrients();
    return (sp.nutrients||[]).map(n=>{
      const nd = nutrients.find(x=>x.id===n.nutrientId);
      if(!nd) return null;
      return {
        nutrientId: n.nutrientId,
        name: nd.name, category: nd.category, unit: nd.unit,
        amount: n.amountPerUnit * quantity
      };
    }).filter(Boolean);
  },
  async createIntake(sp, dateKey, quantity, time, reminderId){
    const entry = {
      id: this.uuid(), dateKey,
      supplementId: sp.id, supplementName: sp.name, supplementUnit: sp.unit,
      reminderId: reminderId || null,
      quantity, takenTime: time,
      nutrientSnapshot: await this.buildSnapshot(sp, quantity)
    };
    await DB.put('dailyIntakes', entry);
    return entry;
  },
  async updateIntakeQuantity(id, quantity){
    const entry = await DB.get('dailyIntakes', id);
    if(!entry) return null;
    entry.quantity = quantity;
    const sp = await DB.get('supplements', entry.supplementId);
    if(sp){
      // 修改 Quantity 用「目前」Supplement 的每單位含量重新計算 snapshot
      entry.nutrientSnapshot = await this.buildSnapshot(sp, quantity);
    }
    // 若 Supplement 已被刪除，找不到每單位含量可供重新換算，則只更新數量本身，不動 snapshot（已知邊界情況）
    await DB.put('dailyIntakes', entry);
    return entry;
  },
  async updateIntakeTime(id, time){
    const entry = await DB.get('dailyIntakes', id);
    if(!entry) return null;
    entry.takenTime = time;
    await DB.put('dailyIntakes', entry);
    return entry;
  },
  async deleteIntake(id){ await DB.delete('dailyIntakes', id); },

  async getScheduledForDate(dateObj){
    const dateKey = this.dateKey(dateObj);
    const weekday = dateObj.getDay();
    const [supplements, intakes] = await Promise.all([this.listSupplements(), this.getIntakesForDate(dateKey)]);
    const takenSupplementIds = new Set(intakes.map(i=>i.supplementId));
    const scheduled = [];
    supplements.forEach(sp=>{
      (sp.reminders||[]).forEach(r=>{
        const matches = r.days === 'daily' || (Array.isArray(r.days) && r.days.includes(weekday));
        if(!matches) return;
        if(takenSupplementIds.has(sp.id)) return;
        scheduled.push({supplement: sp, reminder: r});
      });
    });
    return scheduled;
  },

  // ---- Dashboard ----
  async computeDashboard(dateKey){
    const intakes = await this.getIntakesForDate(dateKey);
    const currentNutrients = await this.listNutrients(); // Daily Target 永遠採用「目前」設定值
    const totals = {};
    intakes.forEach(intake=>{
      (intake.nutrientSnapshot||[]).forEach(ns=>{
        if(!totals[ns.nutrientId]) totals[ns.nutrientId] = {name:ns.name, category:ns.category, unit:ns.unit, total:0};
        totals[ns.nutrientId].total += ns.amount;
      });
    });
    return Object.keys(totals).map(id=>{
      const t = totals[id];
      const current = currentNutrients.find(n=>n.id===id);
      return {
        nutrientId:id, name:t.name, category:t.category, unit:t.unit, total:t.total,
        dailyTarget: current ? current.dailyTarget : null // Nutrient 已刪除 → 仍顯示總量，但不再顯示比較
      };
    });
  },

  // ---- Settings / Data Management ----
  async exportData(){
    const [nutrients, supplements, dailyIntakes] = await Promise.all([
      DB.getAll('nutrients'), DB.getAll('supplements'), DB.getAll('dailyIntakes')
    ]);
    return JSON.stringify({nutrients, supplements, dailyIntakes, exportedAt: new Date().toISOString()}, null, 2);
  },
  async importData(jsonText){
    const data = JSON.parse(jsonText);
    await DB.clearAll();
    for(const nd of data.nutrients||[]) await DB.put('nutrients', nd);
    for(const sp of data.supplements||[]) await DB.put('supplements', sp);
    for(const di of data.dailyIntakes||[]) await DB.put('dailyIntakes', di);
  },
  async clearAllData(){ await DB.clearAll(); },
  async getSettings(){
    let s = await DB.get('settings', 'settings');
    if(!s){ s = {id:'settings', lastExportAt:null}; }
    return s;
  },
  async setLastExportAt(iso){
    const s = await this.getSettings();
    s.lastExportAt = iso;
    await DB.put('settings', s);
    return s;
  },
  async backupStatus(){
    const s = await this.getSettings();
    if(!s.lastExportAt) return {overdue:true, days:null};
    const days = Math.floor((Date.now() - new Date(s.lastExportAt).getTime()) / 86400000);
    return {overdue: days > 10, days};
  },

  // ---- 首次啟動 Seed（避免全空白畫面，示範資料可自由刪改）----
  async seedIfEmpty(){
    const existing = await this.listNutrients();
    const existingSupp = await this.listSupplements();
    if(existing.length > 0 || existingSupp.length > 0) return;

    const vitD = await this.createNutrient({name:'Vitamin D', category:'Vitamins', unit:'μg', dailyTarget:50});
    const bcomplex = await this.createNutrient({name:'Vitamin B Complex', category:'Vitamins', unit:'mg', dailyTarget:null});
    const mg = await this.createNutrient({name:'Magnesium', category:'Minerals', unit:'mg', dailyTarget:300});
    const zinc = await this.createNutrient({name:'Zinc', category:'Minerals', unit:'mg', dailyTarget:15});
    const epa = await this.createNutrient({name:'EPA', category:'Fatty Acids', unit:'mg', dailyTarget:null});
    const dha = await this.createNutrient({name:'DHA', category:'Fatty Acids', unit:'mg', dailyTarget:null});
    await this.createNutrient({name:'CoQ10', category:'Fatty Acids', unit:'mg', dailyTarget:null});

    const d3 = await this.saveSupplement({name:'維他命 D3', unit:'Tablet', defaultQuantity:1,
      nutrients:[{nutrientId:vitD.id, amountPerUnit:50}],
      reminders:[{id:this.uuid(), days:'daily', time:'07:45'}]});
    const omega3 = await this.saveSupplement({name:'Omega-3 魚油', unit:'Capsule', defaultQuantity:2,
      nutrients:[{nutrientId:epa.id, amountPerUnit:330},{nutrientId:dha.id, amountPerUnit:220}],
      reminders:[{id:this.uuid(), days:'daily', time:'08:00'}]});
    await this.saveSupplement({name:'鎂（甘胺酸鎂）', unit:'Tablet', defaultQuantity:2,
      nutrients:[{nutrientId:mg.id, amountPerUnit:120}],
      reminders:[{id:this.uuid(), days:[1,3,5], time:'22:00'}]});
    await this.saveSupplement({name:'維他命 B 群', unit:'Tablet', defaultQuantity:1,
      nutrients:[{nutrientId:bcomplex.id, amountPerUnit:50}],
      reminders:[{id:this.uuid(), days:'daily', time:'08:00'}]});
    await this.saveSupplement({name:'鋅', unit:'Tablet', defaultQuantity:1,
      nutrients:[{nutrientId:zinc.id, amountPerUnit:15}],
      reminders:[{id:this.uuid(), days:[2,4], time:'20:00'}]});

    // 示範今天已攝取兩筆，方便第一次開啟就看得到 Dashboard 效果
    const today = new Date();
    const todayKey = this.dateKey(today);
    await this.createIntake(d3, todayKey, 1, '07:45');
  }
};

/* ======================================================================
   Views — 各頁面 HTML 樣板字串渲染
   ====================================================================== */
const Views = {

  shell(){

      <button class="fab" id="fabBtn"></button>

      <div class="add-sheet" id="addSheet">
        <div class="add-sheet-handle"></div>
        <div class="add-sheet-title">Add Supplement</div>
        <div class="add-sheet-sub">選擇要加入今天紀錄的保健食品</div>
        <div id="addSheetList"></div>
      </div>

      <div class="editor-overlay" id="supplementEditor">

        </div>

          <div class="field-label">Name</div>
          <input class="field-input" id="suppNameInput" placeholder="例如：維他命 C">

          <div class="field-label">Unit</div>

            <button type="button" class="chip" data-action="editor-unit" data-unit="Capsule">Capsule</button>
            <button type="button" class="chip" data-action="editor-unit" data-unit="Tablet">Tablet</button>
            <button type="button" class="chip" data-action="editor-unit" data-unit="Scoop">Scoop</button>
            <button type="button" class="chip" data-action="editor-unit" data-unit="Packet">Packet</button>
            <button type="button" class="chip" data-action="editor-unit" data-unit="Serving">Serving</button>
          </div>

          <div class="field-label">Default Quantity</div>
          <div class="stepper big">
            <button type="button" data-action="editor-qty" data-dir="-1">−</button>
            <span class="val mono" id="suppQtyVal">1</span>
            <button type="button" data-action="editor-qty" data-dir="1">+</button>
          </div>

          <div class="field-label">Nutrients</div>
          <div class="field-hint">下方每項成分的克數，代表「每 1 個單位（1 顆／1 錠）」所含的量，與 Default Quantity 無關。</div>
          <div id="suppNutrientList"></div>

   Modals — 局部彈出視窗內容渲染

const Modals = {
  addSheetItem(sp, summary){
    return `
      <button class="add-sheet-item" data-action="add-supp-today" data-supp="${sp.id}">

  pickerItem(nd, selected){
    return `
      <button class="add-sheet-item" data-action="toggle-picker-nutrient" data-nutrient="${nd.id}">
        <div class="capsule-icon${selected?' filled':''}" style="color:var(--sage-dark)"><span></span><span></span></div>

/* ======================================================================
   App — 集中管理 State、事件委派、頁面路由與初始化
   ====================================================================== */
const App = {
  state: {
    page: 'daily',
    selectedDate: new Date(),
    viewMonth: null,
    editingSupplementId: null,
    editorDraft: null,
    newNutrientDraft: {name:'', category:'Vitamins', unit:'mg', dailyTarget:null},
    nutrientCreateContext: null
  },
  cache: { supplements: [], nutrients: [] },

  async init(){
    document.getElementById('app-shell').innerHTML = Views.shell();
    this.state.viewMonth = new Date(this.state.selectedDate.getFullYear(), this.state.selectedDate.getMonth(), 1);

    await Repository.seedIfEmpty();
    await this.refreshCaches();

    this.bindStaticEvents();
    await this.renderDateStrip();
    await this.goPage('daily');
    registerServiceWorker();
  },

  async refreshCaches(){
    [this.cache.supplements, this.cache.nutrients] = await Promise.all([
      Repository.listSupplements(), Repository.listNutrients()
    ]);
  },

  today(){
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  },
  sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); },
  nutrientById(id){ return this.cache.nutrients.find(n=>n.id===id); },
  supplementById(id){ return this.cache.supplements.find(s=>s.id===id); },
  nutrientsSummary(sp){
    return (sp.nutrients||[]).map(n=>{
      const nd = this.nutrientById(n.nutrientId);
      return nd ? `${nd.name} ${n.amountPerUnit} ${nd.unit}` : '';
    }).filter(Boolean).join(' · ');
  },
  formatReminder(sp){
    const r = (sp.reminders||[])[0];
    if(!r) return '未設定提醒';
    if(r.days === 'daily') return `每天 ${r.time}`;
    const sorted = [...r.days].sort((a,b)=>a-b);
    if(sorted.length===0) return '尚未選擇星期';
    return sorted.map(d=>Views.weekdayLabels[d]).join('、')+' '+r.time;
  },
  roundNum(n){
    const r = Math.round(n*10)/10;
    return Number.isInteger(r) ? r : r.toFixed(1);
  },
  showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(()=> t.classList.remove('show'), 1800);
  },

  /* ---------------- 事件委派：一次綁定，統一分派 ---------------- */
  bindStaticEvents(){
    const root = document.getElementById('app-shell');

    root.addEventListener('click', (e)=>{
      const el = e.target.closest('[data-action]');
      if(!el) return;
      const action = el.dataset.action;
      const handler = this.actions[action];
      if(handler) handler.call(this, el, e);
    });

    root.addEventListener('input', (e)=> this.handleInput(e));
    root.addEventListener('change', (e)=> this.handleChange(e));
  },

  actions: {
    'open-drawer'(){ this.toggleDrawer(true); },
    'close-drawer'(){ this.toggleDrawer(false); },
    'goto'(el){ this.goPage(el.dataset.page); },
    'shift-month'(el){ this.shiftMonth(parseInt(el.dataset.dir)); },

    'open-add-sheet'(){ this.openAddSheet(); },
    'close-add-sheet'(){ this.closeAddSheet(); },
    'add-supp-today'(el){ this.addSupplementToday(el.dataset.supp); },

    'confirm-scheduled'(el){ this.confirmScheduled(el.dataset.supp, el.dataset.reminder); },
    'cancel-intake'(el){ this.cancelIntake(el.dataset.intake); },
    'qty-step-intake'(el){ this.stepIntakeQty(el.dataset.intake, parseInt(el.dataset.dir)); },

    'open-supplement-editor'(el){ this.openSupplementEditor(el.dataset.supp || null); },
    'close-supplement-editor'(){ this.closeSupplementEditor(); },
    'save-supplement'(){ this.saveSupplement(); },
    'editor-unit'(el){ this.setEditorUnit(el.dataset.unit); },
    'editor-qty'(el){ this.stepEditorQty(parseInt(el.dataset.dir)); },
    'remove-editor-nutrient'(el){ this.removeEditorNutrient(parseInt(el.dataset.idx)); },
    'toggle-reminder'(){ this.toggleEditorReminder(); },
    'reminder-mode'(el){ this.setReminderMode(el.dataset.mode); },
    'reminder-weekday'(el){ this.toggleReminderWeekday(parseInt(el.dataset.day)); },

    'toggle-supp-confirm'(el){ this.toggleSuppConfirm(el.dataset.supp); },
    'delete-supplement'(el){ this.deleteSupplement(el.dataset.supp); },

    'open-nutrient-db'(){ this.openNutrientDB(); },
    'close-nutrient-db'(){ this.closeNutrientDB(); },
    'toggle-nutrient-confirm'(el){ this.toggleNutrientConfirm(el.dataset.nutrient); },
    'delete-nutrient'(el){ this.deleteNutrient(el.dataset.nutrient); },

    'open-nutrient-picker'(){ this.openNutrientPicker(); },
    'close-nutrient-picker'(){ this.closeNutrientPicker(); },
    'toggle-picker-nutrient'(el){ this.togglePickerNutrient(el.dataset.nutrient); },

    'open-nutrient-create'(el){ this.openNutrientCreate(el.dataset.context); },
    'close-nutrient-create'(){ this.closeNutrientCreate(); },
    'save-new-nutrient'(){ this.saveNewNutrient(); },
    'new-nutrient-cat'(el){ this.setNewNutrientCat(el.dataset.cat); },
    'new-nutrient-unit'(el){ this.setNewNutrientUnit(el.dataset.u); },

    'export-data'(){ this.exportData(); },
    'toggle-import'(){ document.getElementById('importBox').classList.toggle('open'); },
    'import-data'(){ this.importData(); },
    'clear-data'(){ this.clearData(); }
  },

  handleInput(e){
    if(e.target.id === 'suppNameInput' && this.state.editorDraft) this.state.editorDraft.name = e.target.value;
    if(e.target.id === 'newNutrientName') this.state.newNutrientDraft.name = e.target.value;
    if(e.target.classList.contains('amount')){
      const idx = parseInt(e.target.dataset.idx);
      if(this.state.editorDraft && !isNaN(idx)) this.state.editorDraft.nutrients[idx].amountPerUnit = parseFloat(e.target.value) || 0;
    }
  },

  handleChange(e){
    if(e.target.id === 'reminderTimeInput' && this.state.editorDraft){
      if(this.state.editorDraft.reminders[0]) this.state.editorDraft.reminders[0].time = e.target.value;
    }
    if(e.target.id === 'newNutrientTarget'){
      const v = e.target.value;
      this.state.newNutrientDraft.dailyTarget = v==='' ? null : parseFloat(v);
    }
    if(e.target.classList.contains('ndb-target-input')){
      const id = e.target.dataset.nutrient;
      const v = e.target.value;
      this.updateNutrientTarget(id, v===''? null : parseFloat(v));
    }
  },

  /* ---------------- Page / Drawer ---------------- */
  async goPage(p){
    this.closeAllOverlays();
    this.state.page = p;
    document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
    document.getElementById('page-'+p).classList.add('active');
    document.getElementById('pageTitle').textContent = p.toUpperCase();
    document.querySelectorAll('.drawer-item').forEach(el=> el.classList.toggle('active', el.dataset.page===p));
    document.getElementById('dateNav').style.display = (p==='daily'||p==='dashboard') ? 'block' : 'none';
    this.updateFab(p);

    if(p==='daily') await this.renderDaily();
    if(p==='dashboard') await this.renderDashboard();
    if(p==='supplement') await this.renderSupplementList();
    if(p==='settings') await this.renderSettings();
  },
  closeAllOverlays(){
    this.toggleDrawer(false);
    this.closeAddSheet();
    this.closeNutrientCreate();
    this.closeNutrientPicker();
    this.closeSupplementEditor();
    this.closeNutrientDB();
  },
  toggleDrawer(open){
    document.getElementById('drawer').classList.toggle('open', open);
    document.getElementById('drawerOverlay').classList.toggle('open', open);
  },
  updateFab(p){
    const fab = document.getElementById('fabBtn');
    fab.onclick = null;
    if(p==='daily'){
      fab.classList.add('show'); fab.textContent = '＋ Add Supplement';
      fab.onclick = ()=> this.openAddSheet();
    } else if(p==='supplement'){
      fab.classList.add('show'); fab.textContent = '＋ Add Supplement';
      fab.onclick = ()=> this.openSupplementEditor(null);
    } else {
      fab.classList.remove('show');
    }
  },

  /* ---------------- Date strip ---------------- */
  async renderDateStrip(){
    const y = this.state.viewMonth.getFullYear(), m = this.state.viewMonth.getMonth();
    document.getElementById('monthLabel').textContent = `${y}年 ${m+1}月`;
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const scroll = document.getElementById('dateScroll');
    const today = this.today();
    let html = '';
    for(let d=1; d<=daysInMonth; d++){
      const dateObj = new Date(y,m,d);
      const cls = ['date-cell'];
      if(this.sameDay(dateObj, today)) cls.push('today');
      if(this.sameDay(dateObj, this.state.selectedDate)) cls.push('selected');
      html += `<button type="button" class="${cls.join(' ')}" data-date="${Repository.dateKey(dateObj)}" data-action-inline="select-date">
        <div class="dow">${Views.weekdayLabels[dateObj.getDay()]}</div><div class="num">${d}</div></button>`;
    }
    scroll.innerHTML = html;
    scroll.querySelectorAll('.date-cell').forEach(cell=>{
      cell.onclick = async ()=>{
        const [yy,mm,dd] = cell.dataset.date.split('-').map(Number);
        this.state.selectedDate = new Date(yy, mm-1, dd);
        await this.renderDateStrip();
        if(this.state.page==='daily') await this.renderDaily();
        if(this.state.page==='dashboard') await this.renderDashboard();
      };
    });
    requestAnimationFrame(()=>{
      const sel = scroll.querySelector('.date-cell.selected');
      if(sel) sel.scrollIntoView({behavior:'auto', inline:'center', block:'nearest'});
    });
  },
  async shiftMonth(dir){
    this.state.viewMonth = new Date(this.state.viewMonth.getFullYear(), this.state.viewMonth.getMonth()+dir, 1);
    const today = this.today();
    if(this.state.viewMonth.getFullYear()===today.getFullYear() && this.state.viewMonth.getMonth()===today.getMonth()){
      this.state.selectedDate = today;
    } else {
      this.state.selectedDate = new Date(this.state.viewMonth.getFullYear(), this.state.viewMonth.getMonth(), 1);
    }
    await this.renderDateStrip();
    if(this.state.page==='daily') await this.renderDaily();
    if(this.state.page==='dashboard') await this.renderDashboard();
  },

  /* ---------------- Daily ---------------- */
  async renderDaily(){
    const dateKey = Repository.dateKey(this.state.selectedDate);
    const [scheduled, taken] = await Promise.all([
      Repository.getScheduledForDate(this.state.selectedDate),
      Repository.getIntakesForDate(dateKey)
    ]);

    const schedWrap = document.getElementById('scheduledList');
    schedWrap.innerHTML = scheduled.length
      ? scheduled.map(({supplement, reminder})=> Views.itemRowScheduled(supplement, reminder)).join('')
      : '<div class="empty-hint">這天沒有待確認的提醒項目</div>';

    const takenWrap = document.getElementById('takenList');
    if(taken.length === 0){
      takenWrap.innerHTML = '<div class="empty-hint">這天還沒有已確認攝取的紀錄</div>';
      return;
    }
    takenWrap.innerHTML = taken.map(t => `
      <button class="item-row taken" data-action="open-taken-edit" data-intake="${t.id}">
        <div class="capsule-icon filled"><span></span><span></span></div>
        <div class="item-main">
          <div class="item-name">${t.supplementName}</div>
          <div class="item-sub">${t.quantity} ${t.supplementUnit} · ${t.takenTime}</div>
        </div>
        <div class="item-check">✓</div>
      </button>
      <div class="edit-pop" id="editPop-${t.id}">
        <div class="edit-row"><span>數量</span>
          <div class="stepper">
            <button type="button" data-action="qty-step-intake" data-intake="${t.id}" data-dir="-1">−</button>
            <span class="val mono">${t.quantity}</span>
            <button type="button" data-action="qty-step-intake" data-intake="${t.id}" data-dir="1">+</button>
          </div>
        </div>
        <div class="edit-row"><span>時間</span>
          <input class="time-input" type="time" value="${t.takenTime}" data-intake-time="${t.id}">
        </div>
        <button class="edit-cancel" data-action="cancel-intake" data-intake="${t.id}">取消攝取</button>
      </div>
    `).join('');

    takenWrap.querySelectorAll('[data-action="open-taken-edit"]').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        document.getElementById('editPop-'+btn.dataset.intake).classList.toggle('open');
      };
    });
    takenWrap.querySelectorAll('[data-intake-time]').forEach(input=>{
      input.onclick = (e)=> e.stopPropagation();
      input.onchange = async (e)=>{
        await Repository.updateIntakeTime(input.dataset.intakeTime, e.target.value);
        await this.renderDaily();
      };
    });
  },

  async confirmScheduled(suppId, reminderId){
    const sp = this.supplementById(suppId);
    if(!sp) return;
    const reminder = (sp.reminders||[]).find(r=>r.id===reminderId);
    await Repository.createIntake(sp, Repository.dateKey(this.state.selectedDate), sp.defaultQuantity, reminder ? reminder.time : '08:00', reminderId);
    await this.renderDaily();
    await this.renderDashboard();
    this.showToast('已確認攝取');
  },
  async stepIntakeQty(intakeId, dir){
    const intakes = await Repository.getIntakesForDate(Repository.dateKey(this.state.selectedDate));
    const t = intakes.find(i=>i.id===intakeId);
    if(!t) return;
    const newQty = Math.max(1, t.quantity + dir);
    await Repository.updateIntakeQuantity(intakeId, newQty);
    await this.renderDaily();
    await this.renderDashboard();
    // 重新展開該筆的編輯區，維持操作連續性
    const pop = document.getElementById('editPop-'+intakeId);
    if(pop) pop.classList.add('open');
  },
  async cancelIntake(intakeId){
    await Repository.deleteIntake(intakeId);
    await this.renderDaily();
    await this.renderDashboard();
    this.showToast('已取消攝取');
  },

  /* ---------------- Add-to-today sheet ---------------- */
  async openAddSheet(){
    const list = document.getElementById('addSheetList');
    list.innerHTML = this.cache.supplements.map(sp => Modals.addSheetItem(sp, this.nutrientsSummary(sp))).join('')
      || '<div class="empty-hint">還沒有建立任何 Supplement</div>';
    document.getElementById('addSheet').classList.add('open');
    document.getElementById('sheetOverlay').classList.add('open');
  },
  closeAddSheet(){
    document.getElementById('addSheet').classList.remove('open');
    document.getElementById('sheetOverlay').classList.remove('open');
  },
  async addSupplementToday(suppId){
    const sp = this.supplementById(suppId);
    if(!sp) return;
    const now = new Date();
    const time = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    await Repository.createIntake(sp, Repository.dateKey(this.state.selectedDate), sp.defaultQuantity, time, null);
    this.closeAddSheet();
    await this.renderDaily();
    await this.renderDashboard();
    this.showToast('已新增：'+sp.name);
  },

  /* ---------------- Dashboard ---------------- */
  async renderDashboard(){
    const dateKey = Repository.dateKey(this.state.selectedDate);
    const rows = await Repository.computeDashboard(dateKey);
    const wrap = document.getElementById('dashboardList');
    if(rows.length === 0){
      wrap.innerHTML = '<div class="empty-hint">這天還沒有已確認攝取的紀錄，尚無營養素可加總</div>';
      return;
    }
    wrap.innerHTML = rows.map(r=>{
      const displayTotal = this.roundNum(r.total);
      let amountHtml, extraHtml;
      if(r.dailyTarget){
        const over = r.total > r.dailyTarget;
        const pct = Math.min(100, (r.total / r.dailyTarget) * 100);
        amountHtml = `<span class="${over?'over':''}">${displayTotal}</span> / <span class="target">${r.dailyTarget} ${r.unit}</span>`;
        extraHtml = `<div class="bar-track"><div class="bar-fill${over?' over':''}" style="width:${pct}%"></div></div>`;
      } else {
        amountHtml = `<span class="mono">${displayTotal} ${r.unit}</span>`;
        extraHtml = `<div class="no-target">尚未設定 Daily Target</div>`;
      }
      return `<div class="nutrient-row">
        <div class="nutrient-top">
          <div><span class="nutrient-name">${r.name}</span><span class="nutrient-cat">${r.category}</span></div>
          <div class="nutrient-amount">${amountHtml}</div>
        </div>${extraHtml}
      </div>`;
    }).join('');
  },

  /* ---------------- Supplement list ---------------- */
  async renderSupplementList(){
    await this.refreshCaches();
    const wrap = document.getElementById('supplementList');
    if(this.cache.supplements.length === 0){
      wrap.innerHTML = '<div class="empty-hint">還沒有建立任何 Supplement，點右下角新增一項吧</div>';
      return;
    }
    wrap.innerHTML = this.cache.supplements.map(sp=>{
      const tagsHtml = (sp.nutrients||[]).map(n=>{
        const nd = this.nutrientById(n.nutrientId);
        return nd ? `<span class="tag">${nd.name} · ${n.amountPerUnit} ${nd.unit}</span>` : '';
      }).join('') || '<span class="tag" style="color:var(--ink-faint); border-style:dashed;">尚未設定成分</span>';
      const hasReminder = (sp.reminders||[]).length > 0;
      return `
        <div class="supp-card">
          <div class="supp-card-top">
            <div class="supp-card-info" data-action="open-supplement-editor" data-supp="${sp.id}">
              <div class="supp-name">${sp.name}</div>
              <div class="supp-meta">${sp.defaultQuantity} ${sp.unit}／次</div>
            </div>
            <button class="trash-btn" data-action="toggle-supp-confirm" data-supp="${sp.id}">🗑</button>
          </div>
          <div class="tag-row">${tagsHtml}</div>
          <div class="reminder-line" style="${hasReminder?'':'color:var(--ink-faint)'}">
            <div class="capsule-icon" style="color:${hasReminder?'var(--sage-dark)':'var(--ink-faint)'}"><span></span><span></span></div>
            ${this.formatReminder(sp)}
          </div>
          <div class="confirm-block" id="suppConfirm-${sp.id}">
            <p>刪除後 Daily 將無法再新增這項紀錄，但過去已產生的 Taken 歷史紀錄與 Dashboard 加總不受影響。</p>
            <div class="confirm-actions">
              <button class="btn btn-rust" data-action="delete-supplement" data-supp="${sp.id}">確認刪除</button>
              <button class="btn btn-ghost" data-action="toggle-supp-confirm" data-supp="${sp.id}">取消</button>
            </div>
          </div>
        </div>`;
    }).join('');
  },
  toggleSuppConfirm(id){
    document.getElementById('suppConfirm-'+id).classList.toggle('open');
  },
  async deleteSupplement(id){
    await Repository.deleteSupplement(id);
    await this.refreshCaches();
    await this.renderSupplementList();
    if(this.state.page==='daily') await this.renderDaily();
    await this.renderDashboard();
    this.showToast('已刪除 Supplement');
  },

  /* ---------------- Supplement Editor ---------------- */
  async openSupplementEditor(id){
    this.state.editingSupplementId = id || null;
    const sp = id ? this.supplementById(id) : null;
    this.state.editorDraft = sp
      ? JSON.parse(JSON.stringify(sp))
      : {name:'', unit:'Capsule', defaultQuantity:1, nutrients:[], reminders:[]};
    if(this.state.editorDraft.reminders.length === 0){
      this.state.editorDraft.reminders = [];
    }
    document.getElementById('suppEditorTitle').textContent = sp ? 'Edit Supplement' : 'Add Supplement';
    this.fillEditorForm();
    document.getElementById('supplementEditor').classList.add('open');
  },
  closeSupplementEditor(){
    document.getElementById('supplementEditor').classList.remove('open');
    this.closeNutrientPicker();
    this.closeNutrientCreate();
  },
  fillEditorForm(){
    const d = this.state.editorDraft;
    document.getElementById('suppNameInput').value = d.name;
    document.querySelectorAll('#suppUnitSelect .chip').forEach(c=> c.classList.toggle('active', c.dataset.unit===d.unit));
    document.getElementById('suppQtyVal').textContent = d.defaultQuantity;
    this.renderEditorNutrients();

    const hasReminder = d.reminders.length > 0;
    document.getElementById('reminderSwitch').classList.toggle('on', hasReminder);
    document.getElementById('reminderFields').classList.toggle('show', hasReminder);
    const r = d.reminders[0] || {days:'daily', time:'08:00'};
    this.updateReminderModeUI(r);
    document.getElementById('reminderTimeInput').value = r.time;
  },
  renderEditorNutrients(){
    const wrap = document.getElementById('suppNutrientList');
    const list = this.state.editorDraft.nutrients;
    if(list.length === 0){
      wrap.innerHTML = '<div class="empty-hint">尚未加入任何 Nutrient</div>';
      return;
    }
    wrap.innerHTML = list.map((n, idx)=>{
      const nd = this.nutrientById(n.nutrientId);
      if(!nd) return '';
      return `<div class="nutrient-line">
        <span class="nl-name">${nd.name}</span>
        <input type="number" min="0" class="amount" data-idx="${idx}" value="${n.amountPerUnit}">
        <span class="nl-unit">${nd.unit}</span>
        <button type="button" class="nl-remove" data-action="remove-editor-nutrient" data-idx="${idx}">✕</button>
      </div>`;
    }).join('');
  },
  removeEditorNutrient(idx){
    this.state.editorDraft.nutrients.splice(idx,1);
    this.renderEditorNutrients();
  },
  setEditorUnit(unit){
    this.state.editorDraft.unit = unit;
    document.querySelectorAll('#suppUnitSelect .chip').forEach(c=> c.classList.toggle('active', c.dataset.unit===unit));
  },
  stepEditorQty(dir){
    const d = this.state.editorDraft;
    d.defaultQuantity = Math.max(1, d.defaultQuantity + dir);
    document.getElementById('suppQtyVal').textContent = d.defaultQuantity;
  },
  toggleEditorReminder(){
    const d = this.state.editorDraft;
    const on = document.getElementById('reminderSwitch').classList.toggle('on');
    document.getElementById('reminderFields').classList.toggle('show', on);
    if(on && d.reminders.length===0){
      d.reminders = [{id: Repository.uuid(), days:'daily', time: document.getElementById('reminderTimeInput').value || '08:00'}];
      this.updateReminderModeUI(d.reminders[0]);
    } else if(!on){
      d.reminders = [];
    }
  },
  setReminderMode(mode){
    const d = this.state.editorDraft;
    if(d.reminders.length===0) d.reminders = [{id: Repository.uuid(), days:'daily', time:'08:00'}];
    d.reminders[0].days = (mode==='daily') ? 'daily' : (Array.isArray(d.reminders[0].days) ? d.reminders[0].days : []);
    this.updateReminderModeUI(d.reminders[0]);
  },
  toggleReminderWeekday(day){
    const d = this.state.editorDraft;
    if(!d.reminders[0] || !Array.isArray(d.reminders[0].days)) return;
    const arr = d.reminders[0].days;
    const idx = arr.indexOf(day);
    if(idx>-1) arr.splice(idx,1); else arr.push(day);
    this.updateReminderModeUI(d.reminders[0]);
  },
  updateReminderModeUI(r){
    const isCustom = Array.isArray(r.days);
    document.querySelectorAll('#reminderModeSeg button').forEach(b=>{
      b.classList.toggle('active', (b.dataset.mode==='custom')===isCustom);
    });
    document.getElementById('weekdayPicker').classList.toggle('show', isCustom);
    document.querySelectorAll('#weekdayPicker button').forEach(b=>{
      const day = parseInt(b.dataset.day);
      b.classList.toggle('active', isCustom && r.days.includes(day));
    });
  },
  async saveSupplement(){
    const d = this.state.editorDraft;
    d.name = document.getElementById('suppNameInput').value.trim();
    if(!d.name){ this.showToast('請輸入 Supplement 名稱'); return; }
    if(d.reminders[0]) d.reminders[0].time = document.getElementById('reminderTimeInput').value || d.reminders[0].time;
    d.id = this.state.editingSupplementId || undefined;
    await Repository.saveSupplement(d);
    this.closeSupplementEditor();
    await this.refreshCaches();
    await this.renderSupplementList();
    if(this.state.page==='daily') await this.renderDaily();
    await this.renderDashboard();
    this.showToast('已儲存 Supplement');
  },

  /* ---------------- Nutrient Picker（供 Supplement Editor 使用） ---------------- */
  openNutrientPicker(){
    this.renderNutrientPickerList();
    document.getElementById('nutrientPickerSheet').classList.add('open');
    document.getElementById('pickerScrim').classList.add('open');
  },
  closeNutrientPicker(){
    document.getElementById('nutrientPickerSheet').classList.remove('open');
    document.getElementById('pickerScrim').classList.remove('open');
  },
  renderNutrientPickerList(){
    const wrap = document.getElementById('nutrientPickerList');
    const draftNutrients = this.state.editorDraft.nutrients;
    wrap.innerHTML = this.cache.nutrients.map(nd=>{
      const selected = draftNutrients.some(n=>n.nutrientId===nd.id);
      return Modals.pickerItem(nd, selected);
    }).join('');
  },
  togglePickerNutrient(nutrientId){
    const d = this.state.editorDraft;
    const idx = d.nutrients.findIndex(n=>n.nutrientId===nutrientId);
    if(idx>-1){
      d.nutrients.splice(idx,1);
    } else {
      const nd = this.nutrientById(nutrientId);
      d.nutrients.push({nutrientId, amountPerUnit: nd && nd.dailyTarget ? nd.dailyTarget : 0});
    }
    this.renderNutrientPickerList();
    this.renderEditorNutrients();
  },

  /* ---------------- Nutrient Database screen ---------------- */
  async openNutrientDB(){
    await this.renderNutrientDB();
    document.getElementById('nutrientDbScreen').classList.add('open');
  },
  closeNutrientDB(){
    document.getElementById('nutrientDbScreen').classList.remove('open');
    this.closeNutrientCreate();
  },
  async renderNutrientDB(){
    await this.refreshCaches();
    const wrap = document.getElementById('nutrientDbBody');
    let html = '';
    for(const cat of Views.nutrientCategories){
      const items = this.cache.nutrients.filter(n=>n.category===cat);
      if(items.length===0) continue;
      html += `<div class="nutrient-db-group-label">${cat}</div>`;
      for(const nd of items){
        const usage = await Repository.nutrientUsageCount(nd.id);
        html += Views.nutrientDbRow(nd, usage);
      }
    }
    wrap.innerHTML = html || '<div class="empty-hint">尚未建立任何 Nutrient</div>';
  },
  toggleNutrientConfirm(id){
    document.getElementById('ndbConfirm-'+id).classList.toggle('open');
  },
  async updateNutrientTarget(id, value){
    await Repository.updateNutrientTarget(id, value);
    await this.refreshCaches();
    await this.renderDashboard();
  },
  async deleteNutrient(id){
    await Repository.deleteNutrient(id);
    await this.refreshCaches();
    await this.renderNutrientDB();
    await this.renderSupplementList();
    await this.renderDashboard();
    this.showToast('已刪除 Nutrient');
  },

  /* ---------------- New Nutrient sheet ---------------- */
  openNutrientCreate(context){
    this.state.nutrientCreateContext = context;
    this.state.newNutrientDraft = {name:'', category:'Vitamins', unit:'mg', dailyTarget:null};
    document.getElementById('newNutrientName').value = '';
    document.getElementById('newNutrientTarget').value = '';
    document.querySelectorAll('#newNutrientCategorySelect .chip').forEach(c=> c.classList.toggle('active', c.dataset.cat==='Vitamins'));
    document.querySelectorAll('#newNutrientUnitSelect .chip').forEach(c=> c.classList.toggle('active', c.dataset.u==='mg'));
    document.getElementById('nutrientCreateSheet').classList.add('open');
    document.getElementById('createScrim').classList.add('open');
  },
  closeNutrientCreate(){
    document.getElementById('nutrientCreateSheet').classList.remove('open');
    document.getElementById('createScrim').classList.remove('open');
  },
  setNewNutrientCat(cat){
    this.state.newNutrientDraft.category = cat;
    document.querySelectorAll('#newNutrientCategorySelect .chip').forEach(c=> c.classList.toggle('active', c.dataset.cat===cat));
  },
  setNewNutrientUnit(u){
    this.state.newNutrientDraft.unit = u;
    document.querySelectorAll('#newNutrientUnitSelect .chip').forEach(c=> c.classList.toggle('active', c.dataset.u===u));
  },
  async saveNewNutrient(){
    const draft = this.state.newNutrientDraft;
    if(!draft.name || !draft.name.trim()){ this.showToast('請輸入 Nutrient 名稱'); return; }
    const nd = await Repository.createNutrient(draft);
    this.closeNutrientCreate();
    await this.refreshCaches();
    if(this.state.nutrientCreateContext === 'picker'){
      this.state.editorDraft.nutrients.push({nutrientId: nd.id, amountPerUnit: nd.dailyTarget || 0});
      this.renderNutrientPickerList();
      this.renderEditorNutrients();
    } else {
      await this.renderNutrientDB();
    }
    this.showToast('已新增 Nutrient：'+nd.name);
  },

  /* ---------------- Settings ---------------- */
  async renderSettings(){
    const status = await Repository.backupStatus();
    const banner = document.getElementById('settingsBanner');
    const dot = document.getElementById('settingsDot');
    if(status.overdue){
      const msg = status.days===null ? '尚未執行過 Export，建議立即備份一次。' : `已經 ${status.days} 天未備份資料，建議立即執行 Export，降低 Safari 自動清除資料（ITP）造成遺失的風險。`;
      banner.innerHTML = `<div class="banner">⚠️<span>${msg}</span></div>`;
      dot.style.display = 'block';
    } else {
      banner.innerHTML = '';
      dot.style.display = 'none';
    }
  },
  async exportData(){
    const json = await Repository.exportData();
    try{
      await navigator.clipboard.writeText(json);
      this.showToast('已複製資料 JSON 到剪貼簿');
    }catch(err){
      const ta = document.getElementById('importTextarea');
      ta.value = json;
      document.getElementById('importBox').classList.add('open');
      this.showToast('已將資料填入下方欄位，請手動複製');
    }
    await Repository.setLastExportAt(new Date().toISOString());
    await this.renderSettings();
  },
  async importData(){
    const text = document.getElementById('importTextarea').value.trim();
    if(!text){ this.showToast('請先貼上 JSON 內容'); return; }
    try{
      await Repository.importData(text);
      await this.refreshCaches();
      document.getElementById('importBox').classList.remove('open');
      if(this.state.page==='daily') await this.renderDaily();
      if(this.state.page==='dashboard') await this.renderDashboard();
      if(this.state.page==='supplement') await this.renderSupplementList();
      this.showToast('資料已還原');
    }catch(err){
      this.showToast('JSON 格式錯誤，匯入失敗');
    }
  },
  async clearData(){
    const btn = document.getElementById('clearBtn');
    if(!btn.dataset.armed){
      btn.dataset.armed = '1';
      btn.querySelector('span').textContent = '再次點擊以確認清除';
      setTimeout(()=>{ btn.dataset.armed=''; btn.querySelector('span').textContent='Clear All Data'; }, 3000);
    } else {
      await Repository.clearAllData();
      await this.refreshCaches();
      btn.dataset.armed='';
      btn.querySelector('span').textContent='Clear All Data';
      if(this.state.page==='daily') await this.renderDaily();
      if(this.state.page==='dashboard') await this.renderDashboard();
      if(this.state.page==='supplement') await this.renderSupplementList();
      this.showToast('資料已清除');
    }
  }
};

/* ======================================================================
   Service Worker（Blob 內嵌註冊，離線可開啟外殼）
   ====================================================================== */
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  const swCode = `
    const CACHE = 'supplement-tracker-v1';
    self.addEventListener('install', (e)=>{
      self.skipWaiting();
      e.waitUntil(caches.open(CACHE).then(c=> c.add(self.registration.scope)));
    });
    self.addEventListener('activate', (e)=> self.clients.claim());
    self.addEventListener('fetch', (e)=>{
      if(e.request.method !== 'GET') return;
      e.respondWith(
        caches.match(e.request).then(cached=>{
          const fetchPromise = fetch(e.request).then(resp=>{
            caches.open(CACHE).then(c=> c.put(e.request, resp.clone()));
            return resp;
          }).catch(()=> cached);
          return cached || fetchPromise;
        })
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

document.addEventListener('DOMContentLoaded', ()=> App.init());
</script>
